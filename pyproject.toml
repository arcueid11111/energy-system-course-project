[project]
name = "flowstate-pump-network"
version = "2.0.0"
description = "Offline desktop 2D/3D pump and pipe-network design, simulation, and DXF import"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
